# Verwaltet von VPN-Server.
# Eine einzelne fehlerhafte Verbindung (z. B. ein fehlendes Zertifikat) darf nicht
# den ganzen IPsec-Dienst stoppen; vpnctl meldet Ladefehler selbst.
[Service]
ExecStartPost=
ExecStartPost=-/usr/sbin/swanctl --load-all --noprompt
ExecReload=
ExecReload=-/usr/sbin/swanctl --reload
ExecReload=-/usr/sbin/swanctl --load-all --noprompt
