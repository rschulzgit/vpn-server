name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-flask python3-qrcode \
            python3-cryptography python3-jinja2 python3-pytest python3-gunicorn shellcheck nftables
      - name: Unit-Tests
        run: sudo python3 -m pytest -q tests
      - name: Shellcheck
        run: shellcheck -S warning installer/*.sh iso/build-iso.sh tests/e2e/run.sh
