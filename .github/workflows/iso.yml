name: ISO bauen und testen

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "End-to-End-Test in QEMU ausfuehren"
        type: boolean
        default: true
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "vpnserver/**"
      - "installer/**"
      - "iso/**"
      - "tests/e2e/**"
      - ".github/workflows/iso.yml"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso debian-keyring gpgv

      - name: accel-ppp fuer Debian 13 bauen
        run: |
          mkdir -p build/accel
          docker run --rm -v "$PWD/installer:/src:ro" -v "$PWD/build/accel:/out" debian:trixie \
            bash -c "apt-get update -qq && bash /src/build-accel-ppp.sh deb /out"
          dpkg-deb --info build/accel/accel-ppp.deb | head -20

      - name: ISO bauen
        run: |
          ./iso/build-iso.sh --accel-deb build/accel/accel-ppp.deb --output build
          ./iso/build-iso.sh --accel-deb build/accel/accel-ppp.deb --output build --e2e \
            --debian-iso "$(ls build/cache/debian-13*-netinst.iso)"
          ls -la build

      - name: KVM aktivieren
        if: ${{ inputs.e2e != false }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "kein /dev/kvm"

      - name: Testwerkzeuge installieren
        if: ${{ inputs.e2e != false }}
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils wireguard-tools \
            openvpn openconnect strongswan-swanctl charon-systemd libcharon-extauth-plugins \
            libcharon-extra-plugins sstp-client xl2tpd ppp sshpass curl
          sudo systemctl stop strongswan xl2tpd openvpn || true

      - name: End-to-End-Test (Installation in QEMU + alle Protokolle)
        if: ${{ inputs.e2e != false }}
        run: sudo WORK=/tmp/e2e tests/e2e/run.sh build/vpn-server-*-e2e.iso

      - name: Diagnose
        if: failure()
        run: |
          strip() { sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$1" | tr -d '\r' | tail -n "$2"; }
          sudo test -f /tmp/e2e/install-serial.log && strip /tmp/e2e/install-serial.log 150 || true
          sudo test -f /tmp/e2e/boot-serial.log && strip /tmp/e2e/boot-serial.log 150 || true
          sudo tail -n 80 /tmp/e2e/charon-cli.log || true

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="$(ls build/vpn-server-*-debian13-amd64.iso | grep -v e2e)"
          gh release create "$GITHUB_REF_NAME" "$ISO" "$ISO.sha256" \
            --title "VPN-Server $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
