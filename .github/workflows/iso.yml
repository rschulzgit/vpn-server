name: ISO bauen und testen

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "End-to-End-Test in QEMU ausfuehren"
        type: boolean
        default: true
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "vpnserver/**"
      - "installer/**"
      - "iso/**"
      - "tests/e2e/**"
      - ".github/workflows/iso.yml"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso debian-keyring gpgv

      - name: accel-ppp fuer Debian 13 bauen
        run: |
          mkdir -p build/accel
          docker run --rm -v "$PWD/installer:/src:ro" -v "$PWD/build/accel:/out" debian:trixie \
            bash -c "apt-get update -qq && bash /src/build-accel-ppp.sh deb /out"
          dpkg-deb --info build/accel/accel-ppp.deb | head -20

      - name: ISO bauen
        run: |
          ./iso/build-iso.sh --accel-deb build/accel/accel-ppp.deb --output build
          ./iso/build-iso.sh --accel-deb build/accel/accel-ppp.deb --output build --e2e \
            --debian-iso "$(ls build/cache/debian-13*-netinst.iso)"
          ls -la build

      - name: KVM aktivieren
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || echo "kein /dev/kvm"

      - name: Testwerkzeuge installieren
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf wireguard-tools \
            openvpn openconnect strongswan-swanctl charon-systemd libcharon-extauth-plugins \
            libcharon-extra-plugins libstrongswan-extra-plugins sstp-client xl2tpd ppp sshpass curl \
            zbar-tools librsvg2-bin bind9-dnsutils iptables python3-pyte
          sudo systemctl stop strongswan xl2tpd openvpn || true
          command -v pwsh || sudo snap install powershell --classic
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: KVM verfuegbar?
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        continue-on-error: true
        run: test -w /dev/kvm

      - name: "E2E 1/3: Bootmenue-Test (BIOS, UEFI mit Secure Boot)"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        run: sudo PHASES=boot WORK=/tmp/e2e tests/e2e/run.sh build/vpn-server-*-e2e.iso

      - name: "E2E 2/3: Vollautomatische Installation in QEMU"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        run: sudo PHASES=install WORK=/tmp/e2e tests/e2e/run.sh build/vpn-server-*-e2e.iso

      - name: "E2E 3/3: Geraete- und Funktionstests"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
        run: sudo PHASES=test GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" WORK=/tmp/e2e tests/e2e/run.sh build/vpn-server-*-e2e.iso

      - name: Testprotokolle sichern
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.e2e) }}
        run: |
          mkdir -p e2e-logs
          sudo sh -c 'cp /tmp/e2e/*.log /tmp/e2e/*.jsonl /tmp/e2e/results.* /tmp/e2e/*.calls.json e2e-logs/ 2>/dev/null; true'
          sudo chown -R "$USER" e2e-logs

      - name: Testprotokolle hochladen
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.e2e) }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-protokolle
          path: e2e-logs/
          retention-days: 7

      - name: Diagnose
        if: failure()
        run: |
          strip() { sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$1" | tr -d '\r' | tail -n "$2"; }
          sudo test -f /tmp/e2e/install-serial.log && strip /tmp/e2e/install-serial.log 150 || true
          sudo test -f /tmp/e2e/boot-serial.log && strip /tmp/e2e/boot-serial.log 150 || true
          sudo tail -n 80 /tmp/e2e/charon-cli.log || true

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="$(ls build/vpn-server-*-debian13-amd64.iso | grep -v e2e)"
          gh release create "$GITHUB_REF_NAME" "$ISO" "$ISO.sha256" \
            --title "VPN-Server $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
