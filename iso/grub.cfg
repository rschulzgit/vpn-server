# VPN-Server Installationsmedium (UEFI)
if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi
if background_image /isolinux/splash.png; then
  set color_normal=light-gray/black
  set color_highlight=white/black
else
  set menu_color_normal=cyan/blue
  set menu_color_highlight=white/blue
fi
set timeout=-1
set default=0

menuentry 'VPN-Server automatisch installieren (LOESCHT DIE ERSTE FESTPLATTE!)' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg locale=de_DE.UTF-8 keymap=de --- quiet
    initrd   /install.amd/initrd.gz
}
menuentry 'VPN-Server installieren - Festplatte und Netzwerk selbst waehlen' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=high preseed/file=/cdrom/preseed-manual.cfg locale=de_DE.UTF-8 keymap=de --- quiet
    initrd   /install.amd/initrd.gz
}
menuentry 'Rettungsmodus (Debian)' {
    set background_color=black
    linux    /install.amd/vmlinuz rescue/enable=true --- quiet
    initrd   /install.amd/initrd.gz
}
