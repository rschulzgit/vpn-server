# VPN-Server Installationsmedium (BIOS)
path
include stdmenu.cfg
default vesamenu.c32
prompt 0
timeout 0
menu title VPN-Server Installation (Debian 13)

label vpnauto
	menu label ^VPN-Server automatisch installieren (LOESCHT DIE ERSTE FESTPLATTE!)
	menu default
	kernel /install.amd/vmlinuz
	append auto=true priority=critical preseed/file=/cdrom/preseed.cfg locale=en_US.UTF-8 keymap=de vga=788 initrd=/install.amd/initrd.gz --- quiet

label vpnmanual
	menu label VPN-Server installieren - ^Festplatte und Netzwerk selbst waehlen
	kernel /install.amd/vmlinuz
	append auto=true priority=high preseed/file=/cdrom/preseed-manual.cfg locale=en_US.UTF-8 keymap=de vga=788 initrd=/install.amd/initrd.gz --- quiet

label rescue
	menu label ^Rettungsmodus (Debian)
	kernel /install.amd/vmlinuz
	append rescue/enable=true vga=788 initrd=/install.amd/initrd.gz --- quiet
